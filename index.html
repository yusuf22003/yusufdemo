<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>YusufDemo</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background: #101522;
      color: white;
      font-family: Arial, sans-serif;
    }
    main {
      max-width: 600px;
      margin: 35px auto;
    }
    section {
      background: #1b2334;
      padding: 22px;
      border-radius: 16px;
      margin-bottom: 20px;
    }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 13px;
      margin-top: 12px;
      border-radius: 9px;
      border: 1px solid #39445c;
      font-size: 16px;
    }
    input, textarea {
      background: #101522;
      color: white;
    }
    button {
      background: #45d6a0;
      color: #101522;
      border: 0;
      font-weight: bold;
      cursor: pointer;
    }
    .entry {
      padding: 12px 0;
      border-bottom: 1px solid #39445c;
      overflow-wrap: anywhere;
    }
    #status { color: #45d6a0; }
  </style>
</head>
<body>
<main>
  <h1>YusufDemo</h1>
  <p>منصة اختبار تجريبية</p>

  <section>
    <h2>إرسال بيانات الاختبار</h2>
    <form id="demoForm">
      <input id="testName" placeholder="اسم تجريبي" required maxlength="80">
      <textarea id="testNote" placeholder="ملاحظة تجريبية" maxlength="500"></textarea>
      <button type="submit">إرسال الاختبار</button>
    </form>
    <p id="status"></p>
  </section>

  <section>
    <h2>سجل الاختبارات</h2>
    <div id="entries">جارٍ تحميل البيانات...</div>
  </section>
</main>

<script>
  const SUPABASE_URL = "https://dlmaxrijrqntcssvrsmy.supabase.co";
  const SUPABASE_KEY = "sb_publishable_GT-Qf2XW60whOuv8iecblg_7L5ZlnEZ";

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

  const form = document.getElementById("demoForm");
  const status = document.getElementById("status");
  const entries = document.getElementById("entries");

  async function loadEntries() {
    const { data, error } = await db
      .from("demo_submissions")
      .select("id, test_name, test_note, created_at")
      .order("created_at", { ascending: false })
      .limit(30);

    if (error) {
      entries.textContent = "تعذّر تحميل البيانات. تحقق من إعدادات Supabase.";
      return;
    }

    entries.replaceChildren();

    if (!data.length) {
      entries.textContent = "لا توجد اختبارات بعد.";
      return;
    }

    data.forEach(item => {
      const card = document.createElement("div");
      card.className = "entry";

      const name = document.createElement("strong");
      name.textContent = item.test_name;

      const note = document.createElement("p");
      note.textContent = item.test_note || "بدون ملاحظة";

      const date = document.createElement("small");
      date.textContent = new Date(item.created_at).toLocaleString();

      card.append(name, note, date);
      entries.append(card);
    });
  }

  form.addEventListener("submit", async event => {
    event.preventDefault();
    status.textContent = "جارٍ الإرسال...";

    const testName = document.getElementById("testName").value.trim();
    const testNote = document.getElementById("testNote").value.trim();

    if (!testName) {
      status.textContent = "اكتب اسمًا تجريبيًا.";
      return;
    }

    const { error } = await db
      .from("demo_submissions")
      .insert({
        test_name: testName,
        test_note: testNote || null
      });

    if (error) {
      status.textContent = "فشل الإرسال. تحقق من إعدادات قاعدة البيانات.";
      return;
    }

    status.textContent = "تم إرسال الاختبار بنجاح!";
    form.reset();
    await loadEntries();
  });

  loadEntries();
  setInterval(loadEntries, 3000);
</script>
</body>
</html>
